<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Button Test</title>
    <style>
        .carousel-item {
            position: relative;
            display: inline-block;
            margin: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .carousel-item img {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }
        .image-reference-button:hover {
            background-color: rgb(200, 200, 200) !important;
            color: rgb(100, 100, 100) !important;
        }
    </style>
</head>
<body>
    <h1>Reference Button Test</h1>
    <p>Testing image reference buttons on flagged images</p>

    <div id="test-container">
        <!-- Images will be loaded here -->
    </div>

    <script type="module">
        import { scanImageDirectory } from './js/utils/file-scanner.js';
        import { generateCarouselItem } from './js/utils/content-generator.js';

        async function testReferenceButtons() {
            console.log('🔧 Testing reference button implementation...');

            try {
                const aiImages = await scanImageDirectory('AI');
                console.log('🔧 AI images loaded:', aiImages.length);

                const container = document.getElementById('test-container');
                let html = '';

                // Generate carousel items for first few AI images
                aiImages.slice(0, 6).forEach((imageData, index) => {
                    const projectId = `ai-test-${index}`;
                    console.log(`🔧 Processing image: ${imageData.filename}, hasRef: ${imageData.hasRef}`);

                    const carouselItem = generateCarouselItem(projectId, imageData, 'ai', false);
                    html += carouselItem;
                });

                container.innerHTML = html;

                // Count reference buttons
                const referenceButtons = document.querySelectorAll('.image-reference-button');
                console.log(`🔧 Reference buttons created: ${referenceButtons.length}`);

                referenceButtons.forEach((button, index) => {
                    console.log(`🔧 Reference button ${index + 1} found`);
                });

            } catch (error) {
                console.error('❌ Error testing reference buttons:', error);
            }
        }

        // Run test when page loads
        testReferenceButtons();
    </script>
</body>
</html>
