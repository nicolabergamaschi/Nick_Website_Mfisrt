<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filename Parser Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffeeee; color: #cc0000; }
        .success { background: #eeffee; color: #006600; }
    </style>
</head>
<body>
    <h1>Filename Parser Test</h1>
    <div id="debug-output"></div>

    <script type="module">
        import { parseFilename } from './js/utils/file-scanner.js';

        const debugOutput = document.getElementById('debug-output');

        function log(message, type = 'debug') {
            const div = document.createElement('div');
            div.className = `debug ${type}`;
            div.textContent = message;
            debugOutput.appendChild(div);
            console.log(message);
        }

        function testFilenames() {
            const testFiles = [
                'cg-DMP-3a.mp4',
                'ai-Rombaut-8a.webp',
                'cg-DMP-3.webp',
                'ai-Rombaut-8-1.mp4',
                'ai-Kraut-22.mp4'
            ];

            log('Testing filename parsing...', 'success');

            testFiles.forEach(filename => {
                const result = parseFilename(filename);
                if (result) {
                    log(`✅ ${filename} → category: ${result.categoryShort}, project: ${result.projectName}, index: ${result.index}`, 'success');
                } else {
                    log(`❌ ${filename} → FAILED TO PARSE`, 'error');
                }
            });
        }

        testFilenames();
    </script>
</body>
</html>
