<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Debug - Content Loading Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        img { max-width: 200px; margin: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Debug - Content Loading Test</h1>
    <div id="debug-output"></div>

    <h2>Test Image Loading</h2>
    <div id="image-test">
        <img src="./resources/images/AI/ai-Vogue-1.webp" alt="AI Vogue 1">
        <img src="./resources/images/AI/ai-Vogue-2.webp" alt="AI Vogue 2">
        <img src="./resources/images/CGI/cg-DMP-1.webp" alt="CGI DMP 1">
        <img src="./resources/images/CGI/cg-DMP-2.webp" alt="CGI DMP 2">
    </div>

    <h2>JavaScript Debug</h2>
    <div id="js-debug"></div>

    <script type="module">
        console.log('🚀 Debug page loading...');

        const debugOutput = document.getElementById('debug-output');
        const jsDebug = document.getElementById('js-debug');

        function log(message, type = 'info') {
            console.log(message);
            const div = document.createElement('div');
            div.className = `debug ${type}`;
            div.textContent = message;
            debugOutput.appendChild(div);
        }

        // Test each module individually
        async function testModules() {
            const modules = [
                './js/ui/navigation-buttons.js',
                './js/ui/category-menu.js',
                './js/ui/cursors.js',
                './js/ui/project-description.js',
                './js/ui/carousels.js',
                './js/ui/mobile-function.js',
                './js/ui/highlighted-menu.js',
                './js/content-manager.js',
                './js/ui/references.js'
            ];

            for (const modulePath of modules) {
                try {
                    log(`Testing ${modulePath}...`, 'info');
                    const module = await import(modulePath);
                    log(`✅ ${modulePath} loaded successfully`, 'success');
                    log(`  Exports: ${Object.keys(module).join(', ')}`, 'info');
                } catch (err) {
                    log(`❌ ${modulePath} failed: ${err.message}`, 'error');
                    console.error(`Module error for ${modulePath}:`, err);
                }
            }
        }

        // Test content manager import
        try {
            log('Testing content manager import...', 'info');
            import('./js/content-manager.js').then(module => {
                log('✅ Content manager imported successfully', 'success');
                log('Available exports: ' + Object.keys(module).join(', '), 'info');

                // Try to run the content manager
                if (module.initContentManager) {
                    log('🚀 Starting content manager...', 'info');
                    module.initContentManager().then(() => {
                        log('✅ Content manager completed successfully', 'success');
                    }).catch(err => {
                        log('❌ Content manager error: ' + err.message, 'error');
                        console.error('Content manager error:', err);
                    });
                } else {
                    log('❌ initContentManager function not found', 'error');
                }
            }).catch(err => {
                log('❌ Failed to import content manager: ' + err.message, 'error');
                console.error('Import error:', err);
            });
        } catch (err) {
            log('❌ Error importing content manager: ' + err.message, 'error');
            console.error('Error:', err);
        }

        // Test file access
        log('Testing direct file access...', 'info');
        fetch('./resources/images/AI/ai-Vogue-1.webp')
            .then(response => {
                if (response.ok) {
                    log('✅ AI Vogue 1 file accessible', 'success');
                } else {
                    log('❌ AI Vogue 1 file not accessible: ' + response.status, 'error');
                }
            })
            .catch(err => {
                log('❌ Error accessing AI Vogue 1: ' + err.message, 'error');
            });

        // Run module tests
        testModules();
    </script>
</body>
</html>
